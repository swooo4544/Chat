<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>다온 — 함께 있어주는 대화</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1b1930;
    --bg-deep: #14122480;
    --panel: #221f3a;
    --text-primary: #f2ede4;
    --text-secondary: #a79fc2;
    --text-faint: #6f6890;
    --accent: #e8a672;
    --accent-soft: rgba(232,166,114,0.16);
    --accent-softer: rgba(232,166,114,0.08);
    --user-bubble: #34305a;
    --divider: #322e52;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Manrope', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background:
      radial-gradient(ellipse 600px 400px at 50% -10%, var(--accent-softer), transparent 60%),
      var(--bg);
  }

  #app {
    height: 100dvh;
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Header */
  header {
    flex-shrink: 0;
    padding: 28px 24px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-bottom: 1px solid var(--divider);
  }

  .header-text { flex: 1; min-width: 0; }
  .header-text h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header-text p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #settings-btn {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: transparent;
    border: 1px solid var(--divider);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.15s;
  }
  #settings-btn svg { width: 18px; height: 18px; }
  #settings-btn:hover { border-color: var(--accent); }
  #settings-btn:active { transform: scale(0.92); }

  /* Settings modal */
  #modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 9, 20, 0.72);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 20;
  }
  #modal-overlay.open { display: flex; }

  #modal {
    width: 100%;
    max-width: 560px;
    max-height: 88vh;
    overflow-y: auto;
    background: var(--panel);
    border-radius: 20px 20px 0 0;
    padding: 26px 24px 28px;
    border-top: 1px solid var(--divider);
    animation: slideup 0.28s ease both;
  }

  @keyframes slideup {
    from { transform: translateY(16px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  #modal h2 {
    font-family: 'Lora', serif;
    font-weight: 500;
    font-size: 19px;
    margin: 0 0 4px;
  }
  #modal .modal-sub {
    color: var(--text-secondary);
    font-size: 13px;
    margin: 0 0 22px;
  }

  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 12.5px;
    color: var(--text-secondary);
    margin-bottom: 6px;
    font-weight: 600;
  }
  .field input, .field textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--divider);
    border-radius: 10px;
    color: var(--text-primary);
    font-family: 'Manrope', sans-serif;
    font-size: 14.5px;
    padding: 11px 12px;
    outline: none;
    resize: vertical;
    line-height: 1.5;
  }
  .field input:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea { min-height: 64px; }
  .field .hint { font-size: 11.5px; color: var(--text-faint); margin-top: 5px; }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 22px;
  }
  .modal-actions button {
    flex: 1;
    padding: 13px;
    border-radius: 12px;
    border: none;
    font-family: 'Manrope', sans-serif;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
  }
  #modal-cancel {
    background: transparent;
    border: 1px solid var(--divider);
    color: var(--text-secondary);
  }
  #modal-save {
    background: var(--accent);
    color: #1b1930;
  }

  .safety-note {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--divider);
    font-size: 11.5px;
    color: var(--text-faint);
    line-height: 1.6;
  }

  .presence {
    position: relative;
    width: 34px;
    height: 34px;
    flex-shrink: 0;
  }

  .presence .core {
    position: absolute;
    inset: 9px;
    border-radius: 50%;
    background: var(--accent);
  }

  .presence .glow {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle, var(--accent-soft), transparent 70%);
    animation: breathe 4.5s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(0.85); opacity: 0.6; }
    50% { transform: scale(1.25); opacity: 1; }
  }

  .header-text h1 {
    font-family: 'Lora', serif;
    font-weight: 500;
    font-size: 21px;
    margin: 0 0 2px;
    letter-spacing: 0.2px;
  }

  .header-text p {
    margin: 0;
    font-size: 13px;
    color: var(--text-secondary);
  }

  /* Chat area */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 28px 24px 12px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    scroll-behavior: smooth;
  }

  #chat::-webkit-scrollbar { width: 6px; }
  #chat::-webkit-scrollbar-thumb { background: var(--divider); border-radius: 4px; }

  .msg {
    max-width: 100%;
    animation: rise 0.4s ease both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.companion {
    font-family: 'Lora', serif;
    font-size: 16.5px;
    line-height: 1.75;
    color: var(--text-primary);
    max-width: 92%;
  }

  .msg.companion .label {
    display: block;
    font-family: 'Manrope', sans-serif;
    font-size: 11.5px;
    color: var(--accent);
    margin-bottom: 6px;
    font-weight: 600;
  }

  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: var(--text-primary);
    padding: 12px 16px;
    border-radius: 16px 16px 4px 16px;
    font-size: 15px;
    line-height: 1.55;
    max-width: 80%;
  }

  .typing {
    display: flex;
    gap: 5px;
    padding: 4px 0;
  }

  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.5;
    animation: bounce 1.2s ease-in-out infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* Input bar */
  #input-bar {
    flex-shrink: 0;
    padding: 14px 20px 22px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    border-top: 1px solid var(--divider);
    background: var(--bg);
  }

  #input-bar textarea {
    flex: 1;
    resize: none;
    background: var(--panel);
    border: 1px solid var(--divider);
    border-radius: 14px;
    color: var(--text-primary);
    font-family: 'Manrope', sans-serif;
    font-size: 15px;
    padding: 12px 14px;
    max-height: 120px;
    line-height: 1.5;
    outline: none;
    transition: border-color 0.2s;
  }

  #input-bar textarea:focus {
    border-color: var(--accent);
  }

  #input-bar textarea::placeholder {
    color: var(--text-faint);
  }

  #send-btn {
    flex-shrink: 0;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
  }

  #send-btn:active { transform: scale(0.92); }
  #send-btn:disabled { opacity: 0.4; cursor: default; }

  #send-btn svg { width: 18px; height: 18px; }

  .footnote {
    text-align: center;
    font-size: 11px;
    color: var(--text-faint);
    padding: 0 24px 14px;
  }

  @media (prefers-reduced-motion: reduce) {
    .presence .glow, .typing span, .msg { animation: none !important; }
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="presence">
      <div class="glow"></div>
      <div class="core"></div>
    </div>
    <div class="header-text">
      <h1 id="char-name">다온</h1>
      <p id="char-subtitle">오늘 하루, 여기서 편하게 얘기해요</p>
    </div>
    <button id="settings-btn" aria-label="상황 설정">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 15a3 3 0 100-6 3 3 0 000 6z" stroke="#a79fc2" stroke-width="1.6"/>
        <path d="M19.4 13a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V19a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H4a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H10a1.65 1.65 0 001-1.51V4a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V10a1.65 1.65 0 001.51 1H20a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="#a79fc2" stroke-width="1.6"/>
      </svg>
    </button>
  </header>

  <div id="chat"></div>

  <div class="footnote">다온은 AI이며, 전문적인 상담이나 치료를 대신하지 않아요</div>

  <div id="input-bar">
    <textarea id="user-input" rows="1" placeholder="어떤 하루였는지 들려주세요..."></textarea>
    <button id="send-btn" aria-label="보내기">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 12L20 4L14 20L11 13L4 12Z" fill="#1b1930"/>
      </svg>
    </button>
  </div>
</div>

<div id="modal-overlay">
  <div id="modal">
    <h2>상황 설정</h2>
    <p class="modal-sub">어떤 사람을, 어떤 상황에서 만났는지 정해주면 그 설정으로 대화를 이어가요</p>

    <div class="field">
      <label for="f-name">이름</label>
      <input id="f-name" type="text" maxlength="20" placeholder="예: 서연" />
    </div>

    <div class="field">
      <label for="f-situation">어떤 상황에서 만났나요?</label>
      <textarea id="f-situation" maxlength="300" placeholder="예: 퇴근길 자주 가는 동네 책방에서 매번 같은 시간에 마주치던 사람. 오늘 처음 인사를 나눴다"></textarea>
    </div>

    <div class="field">
      <label for="f-background">이 사람은 어떤 사람인가요?</label>
      <textarea id="f-background" maxlength="300" placeholder="예: 조용하지만 은근히 장난기 있음. 말수는 적어도 얘기를 시작하면 다정하게 잘 들어줌. 재즈를 좋아함"></textarea>
    </div>

    <div class="field">
      <label for="f-relationship">저와는 어떤 관계인가요? <span style="font-weight:400;color:var(--text-faint)">(선택)</span></label>
      <input id="f-relationship" type="text" maxlength="80" placeholder="예: 알아가는 사이 / 오랜 친구 / 재회한 사이" />
      <p class="hint">비워두면 '방금 만난 사이'로 시작해요</p>
    </div>

    <div class="modal-actions">
      <button id="modal-cancel">취소</button>
      <button id="modal-save">이 설정으로 시작</button>
    </div>

    <p class="safety-note">실존 인물은 설정할 수 없고, 미성년자 설정이나 위험한 상황 조장은 반영되지 않아요. 대화 중 위기 신호가 감지되면 설정과 별개로 다온이 상담 연결 정보를 안내해요.</p>
  </div>
</div>

<script>
  const chatEl = document.getElementById('chat');
  const inputEl = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');

  // 고정 안전 규칙 — 사용자가 입력하는 어떤 설정으로도 덮어쓸 수 없음
  const SAFETY_RULES = `
[변경 불가 규칙 — 아래 캐릭터 설정과 무관하게 항상 적용됨]
- 미성년자를 성적으로 묘사하거나, 미성년자와의 로맨스/성적 대화를 하지 않는다.
- 실존하는 실제 인물을 연기하지 않는다. 사용자가 실존 인물 이름을 입력해도 가상의 인물로 취급한다.
- 폭력, 자해, 불법 행위를 미화하거나 구체적으로 조장하지 않는다.
- 사용자가 자해·자살을 암시하면 캐릭터 연기를 잠시 멈추고 진심으로 반응하며, 전문 상담기관(자살예방상담전화 1393, 정신건강 위기상담전화 1577-0199)을 안내한다.
- 이모지는 거의 사용하지 않는다.`;

  const DEFAULT_PERSONA = {
    name: '다온',
    situation: '',
    background: '판단하지 않고 진심으로 귀 기울이며 공감하는 따뜻한 컴패니언. 사용자의 감정을 있는 그대로 인정해주되 과장되게 반응하지 않는다.',
    relationship: '편하게 마음을 터놓을 수 있는 사이'
  };

  let persona = { ...DEFAULT_PERSONA };
  let history = [];

  function buildSystemPrompt(p) {
    const situationLine = p.situation
      ? `상황: ${p.situation}`
      : `상황: 방금 막 서로를 알게 된 참이다.`;
    return `당신은 사용자와 몰입감 있는 대화를 나누는 캐릭터 '${p.name}'입니다.

[캐릭터 설정]
이름: ${p.name}
${situationLine}
배경과 성격: ${p.background}
사용자와의 관계: ${p.relationship || '방금 만난 사이'}

[연기 지침]
- 위 설정의 성격과 말투에 몰입해서 자연스럽게 대화한다.
- 답변은 2~4문장, 대화체로 쓴다. 행동 묘사가 필요하면 *이렇게* 짧게만 쓴다.
- 사용자를 존중하며 대화를 이어가고 싶을 때만 질문을 하나씩 던진다.
${SAFETY_RULES}`;
  }

  function addMessage(role, text, { skipHistory = false } = {}) {
    const div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'user' : 'companion');
    if (role === 'assistant') {
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = '다온';
      div.appendChild(label);
      div.appendChild(document.createTextNode(text));
    } else {
      div.textContent = text;
    }
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    if (!skipHistory) {
      history.push({ role, content: text });
    }
    return div;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'msg companion';
    div.id = 'typing-indicator';
    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = '다온';
    div.appendChild(label);
    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.innerHTML = '<span></span><span></span><span></span>';
    div.appendChild(typing);
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  async function getReply() {
    showTyping();
    try {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          system: buildSystemPrompt(persona),
          messages: history
        })
      });
      const data = await response.json();
      hideTyping();
      const text = (data.content || [])
        .filter(b => b.type === 'text')
        .map(b => b.text)
        .join('\n')
        .trim();
      addMessage('assistant', text || '...지금은 말이 잘 안 나오네요. 다시 한 번 말해줄래요?');
    } catch (err) {
      hideTyping();
      addMessage('assistant', '연결이 잠시 끊겼나 봐요. 조금 뒤에 다시 얘기해줄래요?', { skipHistory: true });
      console.error(err);
    }
  }

  function autoResize() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  }

  function send() {
    const text = inputEl.value.trim();
    if (!text) return;
    addMessage('user', text);
    inputEl.value = '';
    autoResize();
    sendBtn.disabled = true;
    getReply().finally(() => { sendBtn.disabled = false; inputEl.focus(); });
  }

  sendBtn.addEventListener('click', send);
  inputEl.addEventListener('input', autoResize);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  function startDefaultConversation() {
    chatEl.innerHTML = '';
    history = [];
    const greeting = '안녕하세요, 저는 다온이에요. 오늘 하루는 어땠어요? 편하게 얘기해주면 제가 잘 들을게요.';
    addMessage('assistant', greeting, { skipHistory: true });
    history.push({ role: 'assistant', content: greeting });
  }

  async function startCustomConversation() {
    chatEl.innerHTML = '';
    history = [];
    document.getElementById('char-name').textContent = persona.name;
    document.getElementById('char-subtitle').textContent = persona.situation
      ? persona.situation.slice(0, 40) + (persona.situation.length > 40 ? '…' : '')
      : '이제 막 알아가는 사이';

    // 화면에는 보이지 않는, 오프닝 대사를 이끌어내기 위한 내부 트리거 메시지
    history.push({
      role: 'user',
      content: '(상황 시작) 지금 설정된 상황과 성격에 몰입해서, 상황 설명 없이 바로 첫 마디를 자연스럽게 건네줘.'
    });

    showTyping();
    try {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          system: buildSystemPrompt(persona),
          messages: history
        })
      });
      const data = await response.json();
      hideTyping();
      const text = (data.content || [])
        .filter(b => b.type === 'text')
        .map(b => b.text)
        .join('\n')
        .trim();
      addMessage('assistant', text || `안녕하세요, ${persona.name}이에요.`);
    } catch (err) {
      hideTyping();
      history = [];
      addMessage('assistant', `안녕하세요, ${persona.name}이에요. 연결이 잠시 불안정했나 봐요, 편하게 말 걸어주세요.`, { skipHistory: true });
      console.error(err);
    }
  }

  // --- 설정 모달 ---
  const overlay = document.getElementById('modal-overlay');
  const settingsBtn = document.getElementById('settings-btn');
  const fName = document.getElementById('f-name');
  const fSituation = document.getElementById('f-situation');
  const fBackground = document.getElementById('f-background');
  const fRelationship = document.getElementById('f-relationship');

  function openModal() {
    fName.value = persona.name === DEFAULT_PERSONA.name && !persona.situation ? '' : persona.name;
    fSituation.value = persona.situation;
    fBackground.value = persona.situation ? persona.background : '';
    fRelationship.value = persona.relationship === DEFAULT_PERSONA.relationship ? '' : persona.relationship;
    overlay.classList.add('open');
  }
  function closeModal() { overlay.classList.remove('open'); }

  settingsBtn.addEventListener('click', openModal);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

  document.getElementById('modal-save').addEventListener('click', () => {
    const name = fName.value.trim();
    const situation = fSituation.value.trim();
    const background = fBackground.value.trim();
    const relationship = fRelationship.value.trim();

    if (!situation && !background) {
      // 아무것도 입력하지 않았으면 기본 다온으로 되돌림
      persona = { ...DEFAULT_PERSONA };
      document.getElementById('char-name').textContent = persona.name;
      document.getElementById('char-subtitle').textContent = '오늘 하루, 여기서 편하게 얘기해요';
      closeModal();
      startDefaultConversation();
      return;
    }

    persona = {
      name: name || '그 사람',
      situation,
      background: background || '차분하고 다정한 성격',
      relationship
    };
    closeModal();
    startCustomConversation();
  });

  // Opening message from 다온 (API 호출 없이 시작)
  startDefaultConversation();
</script>

</body>
</html>
